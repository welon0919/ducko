[package]
name = "static_site_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
pulldown-cmark = "0.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.18"
anyhow = "1.0.102"
log = "0.4.29"
env_logger = "0.11.9"
tera = "1.20.1"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["fs"] }
tokio = { version = "1.50.0", features = ["full"] }
